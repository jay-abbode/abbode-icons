name: Webster order queue

# Repopulates the WEBSTER_QUEUE tab: every open `webster-live` order with its
# derived thread colors, batched by date. The /machines/routing page reads it.
# Runs twice each weekday morning (ET); also has a manual "Run workflow" button
# for an on-demand refresh before printing.
#
# Uses the SAME five repository secrets as order-stats.yml:
#   GOOGLE_CREDENTIALS_JSON, GOOGLE_SHEET_ID, SHOPIFY_SHOP,
#   SHOPIFY_CLIENT_ID, SHOPIFY_CLIENT_SECRET

on:
  schedule:
    # Hourly through the workday: 09:30–21:30 UTC = 5:30am–5:30pm New York
    # during EDT (6:30am–6:30pm EST). Keeps the board within an hour of
    # Shopify as Webster fulfills — a fulfilled line leaves the queue on the
    # next run. Each run is ~2 minutes of Actions time.
    - cron: '30 9-21 * * 1-6'
  workflow_dispatch:
    inputs:
      days:
        description: 'Look-back window for open orders, in days'
        required: false
        default: '30'
      dry_run:
        description: 'Preview only — do not write the sheet'
        type: boolean
        required: false
        default: false

concurrency:
  group: webster-queue
  cancel-in-progress: false

jobs:
  populate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/webster_queue/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/webster_queue/requirements.txt

      - name: Write Google service-account credentials
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_CREDENTIALS_JSON:-}" ]; then
            echo "::error::GOOGLE_CREDENTIALS_JSON secret is empty or not set."
            exit 1
          fi
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > "$RUNNER_TEMP/google-credentials.json"
          python - <<'PY'
          import json, os
          p = os.path.join(os.environ["RUNNER_TEMP"], "google-credentials.json")
          d = json.load(open(p))
          print("credentials JSON parsed OK — service account:", d.get("client_email", "?"))
          PY

      - name: Populate WEBSTER_QUEUE
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          DAYS: ${{ inputs.days || '30' }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          set -euo pipefail
          python scripts/webster_queue/webster_queue.py \
            --shop          "$SHOPIFY_SHOP" \
            --client-id     "$SHOPIFY_CLIENT_ID" \
            --client-secret "$SHOPIFY_CLIENT_SECRET" \
            --sheet-id      "$GOOGLE_SHEET_ID" \
            --creds         "$RUNNER_TEMP/google-credentials.json" \
            --days          "$DAYS" \
            $DRY

      - name: Summary
        if: always()
        run: |
          {
            echo "### Webster order queue"
            echo ""
            echo "- Look-back: ${{ inputs.days || '30' }} days"
            echo "- Dry run: ${{ inputs.dry_run || 'false' }}"
            echo "- Result: ${{ job.status }}"
            echo ""
            echo "The routing page (/machines/routing) reflects a fresh WEBSTER_QUEUE within ~60s. No redeploy needed."
          } >> "$GITHUB_STEP_SUMMARY"
